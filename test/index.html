<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <div id="content">
    페이지를 확인하고 있습니다.
  </div>

  <script>
    const userAgent = navigator.userAgent;

    const isAndroid = /Android/i.test(userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(userAgent);

    const content = document.getElementById("content");

    if (isAndroid) {

      content.innerHTML = `
        <h1>ETF CHECK 앱 설치</h1>
        <p>ETF CHECK 앱을 설치해주세요.</p>

        <button onclick="openPlayStore()">
          Google Play에서 설치
        </button>
      `;

    } else if (isIOS) {
      window.location.href = "https://itunes.apple.com/kr/app/apple-store/1548228110";

    } else {

      window.location.href = "https://www.koreaetf.com/";
    }

    function openPlayStore() {
      window.location.href =
        "intent://details?id=com.koscom.etpportal" +
        "#Intent;" +
        "scheme=market;" +
        "package=com.android.vending;" +
        "S.browser_fallback_url=" +
        encodeURIComponent(
          "https://play.google.com/store/apps/details?id=com.koscom.etpportal"
        ) +
        ";end";
    }
  </script>

</body>
</html>
