<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <div id="content">
    <img src="KOREA ETF 랜딩 스플래시 화면_20260828.svg"/>
  </div>

  <script>
    const userAgent = navigator.userAgent;

    const isAndroid = /Android/i.test(userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(userAgent);

    const content = document.getElementById("content");

    if (isAndroid) {
      openPlayStore();

    } else if (isIOS) {
      window.location.href = "https://apps.apple.com/kr/app/etf-check/id1548228110";

    } else {

      window.location.href = "https://www.koreaetf.com/";
    }

    function openPlayStore() {
      window.location.href =
        "intent://details?id=com.koscom.etpportal" +
        "#Intent;" +
        "scheme=market;" +
        "package=com.android.vending;" +
        "S.browser_fallback_url=" +
        encodeURIComponent(
          "https://play.google.com/store/apps/details?id=com.koscom.etpportal"
        ) +
        ";end";
    }
  </script>

</body>
</html>
