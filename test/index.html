<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
    const userAgent = navigator.userAgent;

    const isAndroid = /Android/i.test(userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(userAgent);
    if (isAndroid) {
      window.location.href =
      "intent://details?id=com.koscom.etpportal" +
      "#Intent;" +
      "scheme=market;" +
      "package=com.android.vending;" +
      "S.browser_fallback_url=" +
      encodeURIComponent(
        "https://play.google.com/store/apps/details?id=com.koscom.etpportal"
      ) +
      ";end";
    } else if (isIOS) {
      console.log("this is ios");
    } else {
      window.location.href = "https://play.google.com/store/search?q=etf%20check&c=apps&hl=ko";
    }
    
  </script>
</head>

<body>
  <h1>ETF CHECK 설치 페이지로 이동합니다.</h1>
</body>
</html>
